version: "3.9"

services:
  redis:
    image: redis:latest
    container_name: redis-container-for-test
    ports:
      - "6379:6379"
    volumes:
      - redisVolume:/data
    command: redis-server --appendonly yes
    restart: always

  mongo:
    image: mongo:latest
    container_name: mongoDBforTest
    ports:
      - "27017:27017"
    volumes:
      - mongoVol:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    restart: always

  mysql:
    image: mysql:latest
    container_name: mysqlDBforTest
    ports:
      - "3307:3306"
    volumes:
      - mysqlVol:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: astadambole
      MYSQL_DATABASE: studySyncDb
      MYSQL_USER: Mokshgna
      MYSQL_PASSWORD: astadambole
    restart: always

volumes:
  redisVolume:
  mongoVol:
  mysqlVol:
